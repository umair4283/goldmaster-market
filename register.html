<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — NovaFX</title><link rel="stylesheet" href="style.css"></head><body><main style="max-width:620px;margin:auto;padding:60px 5%"><div class="logo">NOVA<span>FX</span></div><h1 style="font-size:42px">Create account</h1><p class="lead">Demo registration form. Production submissions require a secure backend and KYC workflow.</p><form id="reg" style="display:grid;gap:14px"><input required placeholder="Full name"><input required type="email" placeholder="Email"><input required placeholder="Phone"><input placeholder="Country"><input id="ref" placeholder="IB / Referral code"><input required type="password" placeholder="Password"><label><input required type="checkbox"> I accept the Terms and Risk Disclosure</label><button class="btn" type="submit">Create Demo Account</button></form><p id="msg"></p><p><a href="index.html" style="color:#d7a83e">Back to website</a></p></main><script>const p=new URLSearchParams(location.search);document.getElementById('ref').value=p.get('ref')||'';document.getElementById('reg').onsubmit=e=>{e.preventDefault();document.getElementById('msg').textContent='Demo account created locally. Connect a backend before using real customer data.'}</script></body></html>
